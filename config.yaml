# Example configuration. Put overrides in config.local.yaml (gitignored).
# Secrets do NOT belong here: use environment variables (GRAPH_AGENT_ prefix).

models:
  brain:
    model: local-brain
    api_base: http://localhost:4000
    api_key_env: LITELLM_API_KEY
    temperature: 0.2
    max_tokens: 4096
  router:
    model: local-small
    api_base: http://localhost:4000
    api_key_env: LITELLM_API_KEY
    temperature: 0.0
    max_tokens: 256

agent:
  max_iterations: 25
  workspace: data/workspace
  checkpointer_db: data/checkpoints.sqlite
  # hard-reset a session after this many minutes of inactivity (null = never)
  session_ttl_minutes: null
  # automatic compaction: once the context exceeds this many tokens, older
  # messages are summarized (keeping the last ones verbatim). 0 disables it.
  context_token_limit: 200000
  compaction_keep_messages: 20

memory:
  enabled: true
  dir: memory

skills:
  # progressive disclosure: index in the system prompt, SKILL.md read on demand
  enabled: true
  dir: skills

sandbox:
  # shell execution via bubblewrap (deployed on a dedicated VM: no Docker)
  timeout_seconds: 120
  approval_required: true
  # share the host network namespace (needed by curl/pip/apt). Off = no outbound net.
  network: false
  # extra writable binds {destination_inside_jail: host_path}. Use to let the agent
  # install packages that persist (pip/uv/static binaries), e.g.:
  # writable_binds:
  #   /usr/local: /opt/graph-agent/usr-local
  # paths made invisible inside the jail (e.g. your secrets)
  # mask_paths:
  #   - /home/me/graph_agent/.env
  # case-insensitive regexes that block commands before execution
  deny_patterns:
    - '\bsudo\b'
    - '\brm\s+(-[a-z]*[rf][a-z]*\s+)+/'
    - '\bmkfs\b'
    - ':\(\)\s*\{'

channels:
  http:
    enabled: false
    host: 127.0.0.1
    port: 8080
    # Bearer auth for /v1/* (the secret lives in the env var, not here)
    # api_key_env: GRAPH_AGENT_HTTP_TOKEN
  telegram:
    enabled: false
    token_env: TELEGRAM_BOT_TOKEN
    # fail-closed: empty list rejects every user
    allowed_user_ids: []
  realtime:
    # served on the HTTP server (same host/port/token): ws://<host>:<port>/v1/realtime
    enabled: false
    # backend: "openai" (OpenAI-compatible, e.g. LiteLLM /v1/realtime) or "qwen" (Alibaba Model Studio)
    backend: openai
    model: ""
    # openai: LiteLLM base (http://localhost:4000)
    # qwen:   full realtime URL, e.g. wss://<host>/api-ws/v1/realtime
    api_base: http://localhost:4000
    # api_key_env: LITELLM_API_KEY
    # lean switchboard prompt: by default only the agent persona/system_prompt is
    # sent (no skills/memory/tool details). Override with a short custom prompt here.
    # instructions: "You are the voice front desk of my assistant."
    # output voice id, provider-specific (e.g. Qwen-Audio "longanlingxin"). Empty
    # keeps the model default.
    # voice: ""
  voice:
    # Asterisk AudioSocket server (telephony bridge). The dialplan calls
    # AudioSocket(uuid, <host>:<port>); the phone leg is bridged to the
    # realtime backend above, reusing delegate_to_brain.
    enabled: false
    host: 0.0.0.0
    port: 8101
    # PCM rate of the audio going IN (telephony -> backend). Qwen input ~16000.
    sample_rate: 16000
    # PCM rate of the backend audio OUT (backend -> telephony). Qwen output ~24000,
    # OpenAI ~24000. Defaults to sample_rate when omitted.
    output_sample_rate: 24000
    # optional: make the brain speak first with this instruction
    # greeting: "Saluta in italiano e chiedi come puoi aiutare."
    # --- outbound (agent places calls through Asterisk AMI) ---
    # address Asterisk dials back to reach this AudioSocket server (required to
    # register the call_phone tool / voice sink). It is written in Originate Data.
    # advertise_host: <agent-host>
    # trunk: trunk
    # caller_id: "caller id"
    # default target dialed when the agent calls without an explicit number
    # default_target: "target cellphone"
    # Asterisk AMI: use the CT's routable address (agents on another host may be
    # NATed by their gateway, so allow that source IP in manager.conf `permit`)
    # ami_host: <asterisk-host>
    # ami_port: 5038
    # ami_username: graphagent
    # ami_secret_env: ASTERISK_AMI_SECRET

scheduler:
  enabled: false
  jobstore_db: data/scheduler.sqlite

mcp:
  servers: []
  # - name: kb
  #   command: uvx
  #   args: ["mcp-server-something"]
  #   env: {}

tools:
  filesystem:
    enabled: true
    root: data/workspace
  shell:
    enabled: true
  web_search:
    # real api_base/enable in config.local.yaml (domain not versioned)
    enabled: false
    provider: searxng
    api_base: http://localhost:8888
    # SearXNG aggregates several engines; a single query routinely takes ~5s.
    timeout_seconds: 30

logging:
  level: INFO
  json: false
